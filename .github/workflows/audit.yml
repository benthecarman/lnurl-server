name: Security audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # weekly, so new RustSec advisories are caught even without commits
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
